[Application]
url = https://magento.softwaretestingboard.com/

[Browser]
browser = chrome
headless = false

[Timeouts]
implicitlyWait = 10

[Paths]
excelFilePath = test_data/test_data.xlsx
jsonFilePath = test_data/config.json

[pytest]
adopts =
    --alluredir=allure-results
    --clean-alluredir
markers =
    bdd: mark tests as BDD scenarios